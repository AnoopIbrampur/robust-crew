[project]
name = "robust-crew"
version = "0.1.0"
description = "Delay-robust airline crew pairing: CP-SAT + learned connection-break risk, evaluated by replaying real BTS delays."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    "airportsdata>=20240316",
    "matplotlib>=3.8",
    "pytz>=2026.6",
    "ortools>=9.15.6755",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robust_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
